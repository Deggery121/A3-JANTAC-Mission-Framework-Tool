name: Check and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check master mission
        run: python tools/check_master.py

      - name: Build compositions
        run: python tools/build_compositions.py

      - name: Package release files
        run: |
          mkdir -p dist
          cd build && zip -qr ../dist/JANTAC-compositions.zip compositions && cd ..
          cd master/UnitLibrary.VR && zip -qr ../../dist/JANTAC-customization.zip customization && cd ../..

      - uses: actions/upload-artifact@v4
        with:
          name: jantac-build
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
